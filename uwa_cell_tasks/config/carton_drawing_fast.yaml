# Gazebo drawing playback. Physical UR profiles use separate configuration.
arms:
- right_front
- right_rear
braking_acceleration_rad_s2: 2.0
dwell_s: 2.0
exploration_mode: true
finger_joint_damping_nm_s: 0.08
finger_velocity_limit_rad_s: 0.2
force_observation: false
friction: 0.6
# Effective Coulomb coefficient for right grip-pad/carton pairs only.
grip_contact_friction: 1.0
grasp_entry_min_duration_s: 0.1
gripper_coarse_velocity_rad_s: 0.1
gripper_fine_start_rad: 0.65
gripper_fine_velocity_rad_s: 0.02
gripper_gear_stiffness_nm_rad: 100.0
gripper_motor_stiffness_nm_rad: 30.0
gripper_motor_torque_limit_nm: 0.7
gripper_transmission: elastic_gear
joint_acceleration_rad_s2: 2.0
joint_jerk_rad_s3: 10.0
joint_velocity_rad_s: 1.0
lift_m: 0.03
mass_kg: 0.5
max_object_speed_m_s: 0.1
maximum_attempts: 3
maximum_observation_age_s: 5.0
object_id: avocado_carton
pad_load_reference_n: 50.0
physics_engine: dartsim
physics_step_s: 0.001
pregrasp_distance_m: 0.08
relative_angle_tolerance_rad: 0.017453292519943295
relative_position_tolerance_m: 0.002
schema_version: 1
simulation_assumptions:
- rigid_empty_carton
- upright_carton_on_horizontal_support
- user_reported_mass
- unmeasured_friction
- approximate_geometry
- unmeasured_finger_damping
- unmeasured_transmission_stiffness
- idealized_parallel_transmission
- idealized_arm_actuators
- unmeasured_motor_controller_and_torque_mapping
simulation_real_time_factor: 1.0
simulation_stop_reserve_mode: observe
wall_thickness_m: 0.0025
