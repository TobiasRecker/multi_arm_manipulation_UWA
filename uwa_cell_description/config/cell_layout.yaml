# Metres and radians. World: X right, Y rear, Z up; origin at floor centre.
# Table poses are floor-centre poses; mount poses refer to URDF base_link
# relative to the table's upper surface. Height and base yaws are estimates.
# Cable bearings (user estimate, 2026-11-06): left_front toward the operator
# (-Y), left_rear +Y, right_front toward the centre (-X), right_rear +X.
# left_front is rotated -90 degrees from the initial layout (+90 -> 0).
tables:
  left:
    xyz: [-0.45, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    width: 0.80
    length: 1.70
    height: 0.90
    top_thickness: 0.05
    leg_width: 0.05
  right:
    xyz: [0.45, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    width: 0.80
    length: 1.70
    height: 0.90
    top_thickness: 0.05
    leg_width: 0.05
# Robotiq 2F-85 (confirmed), Wrist Camera 2019, no separate tool plate.
# Common settings; each robot can override individual keys under `tools`.
tools:
  gripper: 2f_85
  gripper_initial_position: 0.0  # rad: 0=open, 0.8=closed
  gripper_yaw: 0.0
  camera_enabled: true
  # UR tool0 +Y points away from the tool I/O plug: matches the real mounting.
  # See THIRD_PARTY.md for the UR coordinate convention. pi swaps the side.
  camera_yaw: 0.0
  camera_width: 640
  camera_height: 480
  camera_rate: 10.0  # reduced rendering load for four cameras
  camera_horizontal_fov: 0.8726646259971648  # 50 degrees
charuco:
  enabled: true
  dictionary: DICT_4X4_100
  squares_x: 7
  squares_y: 5
  square_length: 0.04
  marker_length: 0.028
  margin: 0.02
  thickness: 0.003
  pixels_per_square: 200
  # Camera targets used by prepare_charuco_views; coordinates above each tabletop.
  view_height: 0.55
  view_offset: 0.28
  min_corners: 12
  samples: 10
  max_translation_error: 0.01
  max_rotation_error_deg: 2.0
  max_reprojection_error_px: 1.0
  boards:
    left:
      center_xyz: [0.0, 0.0, 0.003]
      yaw: 0.0
      marker_start: 0
    right:
      center_xyz: [0.0, 0.0, 0.003]
      yaw: 0.0
      marker_start: 50
robots:
  left_front:
    type: ur5
    table: left
    mount_xyz: [0.0, -0.675, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
    initial_positions: [1.249400825263, -1.843683752555, 1.712763937445, -2.410104221538, -1.302728224516, -0.179475624579]
    kinematics_file: null
  left_rear:
    type: ur7e
    table: left
    mount_xyz: [0.0, 0.675, 0.0]
    mount_rpy: [0.0, 0.0, 3.141592653589793]
    initial_positions: [1.156343972423, -1.923678973178, 1.937577321054, -2.538078577348, -1.226379855048, -0.235292530833]
    kinematics_file: null
  right_front:
    type: ur5e
    table: right
    mount_xyz: [0.0, -0.675, 0.0]
    mount_rpy: [0.0, 0.0, -1.5707963267948966]
    initial_positions: [0.414452354372, -1.217913680412, -1.937577321053, -0.603514076241, 1.226379855048, 0.235292530833]
    kinematics_file: null
  right_rear:
    type: ur5e
    table: right
    mount_xyz: [0.0, 0.675, 0.0]
    mount_rpy: [0.0, 0.0, 1.5707963267948966]
    initial_positions: [0.414452354372, -1.217913680412, -1.937577321053, -0.603514076241, 1.226379855048, 0.235292530833]
    kinematics_file: null
scan:
  source: ~/GoogleDrive/UWA/UR Setup.ply
  # Coarse tabletop fit, 2026-11-09; NOT a measured calibration.
  # Uses floor normal + the two tabletop rectangles. Heading resolved using:
  # high item-profile robot cell behind (+Y), ~2 m clear space in front (-Y).
  # Table height remains the provisional model value; floor mismatch is ~0.13 m.
  scale: 0.9531928101629115
  xyz: [-0.2874986696433722, -0.43623572063603466, 0.5876544767930126]
  rpy: [-1.5666319041686247, 0.006099951639325196, 1.0496523179958193]
  opacity_min: 0.1
  max_splat_scale: 0.05
  voxel_size: 0.01
  max_points: 200000
  # Display cleanup after alignment, in WORLD METRES; raw PLY/cache stay intact.
  crop_radius: 4.0
  crop_center: null  # automatically use the mean position of the four robot bases
  # Fixed masks for the CAPTURED arm poses, not the moving simulated arms.
  # Upper masks preserve tabletop surfaces and most flat objects on them.
  exclude_boxes:
    - name: left_front_scan_arm
      min: [-0.75, -1.00, 0.95]
      max: [-0.35, -0.34, 1.65]
    - name: left_rear_scan_arm
      min: [-0.57, 0.08, 0.95]
      max: [-0.13, 0.76, 1.60]
    - name: right_front_scan_arm
      min: [0.22, -0.77, 0.95]
      max: [0.64, 0.00, 1.60]
    - name: right_rear_scan_arm
      min: [0.03, 0.25, 0.95]
      max: [0.91, 0.86, 1.70]
    - name: left_front_scan_base
      min: [-0.72, -0.84, 0.915]
      max: [-0.38, -0.54, 0.96]
    - name: left_rear_scan_base
      min: [-0.57, 0.48, 0.915]
      max: [-0.25, 0.76, 0.96]
    - name: right_front_scan_base
      min: [0.26, -0.76, 0.915]
      max: [0.58, -0.46, 0.96]
    - name: right_rear_scan_base
      min: [0.26, 0.48, 0.915]
      max: [0.61, 0.79, 0.96]
