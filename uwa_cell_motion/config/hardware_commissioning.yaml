# Slow unloaded commissioning only; actual stop latency/braking NOT qualified.
# Same geometry margin, state freshness, check rate and assumed stop response
# as hardware_motion.yaml. Reduced commanded/observed arm speed bounds reduce
# the derived swept stopping distance; no fixed clearance override is used.
rate_hz: 10.0
state_timeout_s: 0.20
heartbeat_timeout_s: 0.25
stop_latency_s: 1.0
braking_acceleration_rad_s2: 0.2
velocity_limit_rad_s: 0.003
acceleration_limit_rad_s2: 0.006
model_margin_m: 0.04
reset_hysteresis_m: 0.01
standstill_velocity_rad_s: 0.001
standstill_window_s: 0.50
sphere_spacing_m: 0.05
planning_budget_s: 10.0
joint_check_step_rad: 0.005
field_step_s: 0.10
field_influence_m: 0.18
field_max_steps: 3000
goal_tolerance_rad: 0.001
