# Explicit unloaded right_front q6 stop test, 2026-11-17.
# User requested a 0.1 rad/s monitored q6 cap after the first speed-limit stop.
# Command speed and all other physical joint caps remain 0.003 rad/s.
# Stop latency/braking remain engineering assumptions, not measured limits.
rate_hz: 10.0
state_timeout_s: 0.20
heartbeat_timeout_s: 0.25
stop_latency_s: 1.0
braking_acceleration_rad_s2: 0.2
velocity_limit_rad_s: 0.003
command_velocity_limit_rad_s: 0.003
acceleration_limit_rad_s2: 0.006
stopping_reserve_model: per_body_joint_caps_v2
joint_velocity_limits_rad_s:
  left_front: [0.003, 0.003, 0.003, 0.003, 0.003, 0.003]
  left_rear: [0.003, 0.003, 0.003, 0.003, 0.003, 0.003]
  right_front: [0.003, 0.003, 0.003, 0.003, 0.003, 0.1]
  right_rear: [0.003, 0.003, 0.003, 0.003, 0.003, 0.003]
model_margin_m: 0.04
reset_hysteresis_m: 0.01
standstill_velocity_rad_s: 0.001
standstill_window_s: 0.50
sphere_spacing_m: 0.05
planning_budget_s: 10.0
joint_check_step_rad: 0.005
field_step_s: 0.10
field_influence_m: 0.18
field_max_steps: 3000
goal_tolerance_rad: 0.001
